app_version: 1.0.0
classname: PresetColl
name: ''
preset_data:
  grid_configs:
    Hayami:
    - always_show_subgrid: false
      grid_defn:
      - border_width: 0
        callback: build_cell_strings
        keys: QWDFG JUKYP ASERT HNIOL ZXCVB ;M,./
        num_cells_x: 16
        num_cells_y: 1
      - border_width: 1
        callback: build_cell_strings
        keys: QWDFG JUKYP ASERT HNIOL ZXCVB ;M,./
        num_cells_x: 1
        num_cells_y: 30
      - border_width: 0
        callback: apply_strings_and_subgrid_to_cells
        keys: ''
        num_cells_x: 2
        num_cells_y: 1
      hold_subgrid_key_for_nudge: true
      name: position_based_columns
      nudges_per_cell: 4
      strategy: subgrid
      subgrid_dims:
      - 10
      - 3
      subgrid_mouse_action_keys: QWDFG JUKYP ASERT HNIOL ZXCVB ;M,./
    QWERTY:
    - always_show_subgrid: false
      grid_defn:
      - border_width: 0
        callback: build_cell_strings
        keys: QWERT YUIOP ASDFG HJKL; ZXCVB NM,./
        num_cells_x: 16
        num_cells_y: 1
      - border_width: 1
        callback: build_cell_strings
        keys: QWERT YUIOP ASDFG HJKL; ZXCVB NM,./m
        num_cells_x: 1
        num_cells_y: 30
      - border_width: 0
        callback: apply_strings_and_subgrid_to_cells
        keys: ''
        num_cells_x: 2
        num_cells_y: 1
      hold_subgrid_key_for_nudge: true
      name: position_based_columns
      nudges_per_cell: 4
      strategy: subgrid
      subgrid_dims:
      - 10
      - 3
      subgrid_mouse_action_keys: QWERT YUIOP ASDFG HJKL; ZXCVB NM,./
  style_configs.0.text:
    1080p Monitor:
      char_anchor: center
      char_display: all
      char_spacing_cell_width_ratio: 0.5
      char_spacing_font_size_ratio: 0.5
      char_spacing_strategy: cell_width_relative
      font_size_multiplier: 0.4
      font_weight: 600
      subgrid_font_size_multiplier: 0.75
      subgrid_text_rgba:
      - 1
      - 1
      - 1
      - 0.5
      text_rgba:
      - 1
      - 1
      - 1
      - 1
      text_shadow_blur_radius: 4
      text_shadow_offset:
      - 0
      - 0
      text_shadow_rgba:
      - 0.02
      - 0.04
      - 0.06
      - 1
      text_y_offset: 0
    4K Monitor:
      char_anchor: center
      char_display: all
      char_spacing_cell_width_ratio: 0.5
      char_spacing_font_size_ratio: 0.5
      char_spacing_strategy: cell_width_relative
      font_size_multiplier: 0.3
      font_weight: 500
      subgrid_font_size_multiplier: 0.75
      subgrid_text_rgba:
      - 1
      - 1
      - 1
      - 0.5
      text_rgba:
      - 1
      - 1
      - 1
      - 1
      text_shadow_blur_radius: 4
      text_shadow_offset:
      - 0
      - 0
      text_shadow_rgba:
      - 0.02
