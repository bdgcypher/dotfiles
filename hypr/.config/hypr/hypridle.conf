general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({action="on"})'
    inhibit_sleep = 3
}

# Screensaver (before lock)
listener {
    timeout = 270                                                  # 4.5min
    on-timeout = pidof hyprlock || hypr-screensaver start          # start screensaver (if we haven't locked already)
    on-resume = hypr-screensaver stop                              # any activity dismisses it
}

# 1. Lock Screen (5 mins) - ONLY on battery power
listener {
    timeout = 300
    on-timeout = bash -c 'compgen -G "/sys/class/power_supply/BAT*" >/dev/null && grep -q "Discharging" /sys/class/power_supply/BAT*/status && loginctl lock-session'
}

# 2. Turn off keyboard backlight (5 mins) - ONLY if on battery OR manually locked
listener {
    timeout = 300
    on-timeout = bash -c 'compgen -G "/sys/class/power_supply/BAT*" >/dev/null && grep -q "Discharging" /sys/class/power_supply/BAT*/status && brightnessctl -sd "*::kbd_backlight" set 0 || (pidof hyprlock >/dev/null && brightnessctl -sd "*::kbd_backlight" set 0)'
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# 3. Turn off screens (5 mins) - ONLY if on battery OR manually locked
listener {
    timeout = 300
    on-timeout = bash -c 'compgen -G "/sys/class/power_supply/BAT*" >/dev/null && grep -q "Discharging" /sys/class/power_supply/BAT*/status && hyprctl dispatch "hl.dsp.dpms({action=\"off\"})" || (pidof hyprlock >/dev/null && hyprctl dispatch "hl.dsp.dpms({action=\"off\"})")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})' && brightnessctl -r
}

# 4. Suspend / Hibernate (5.5 mins) - ONLY if on battery OR manually locked
listener {
    timeout = 330
    on-timeout = bash -c 'compgen -G "/sys/class/power_supply/BAT*" >/dev/null && grep -q "Discharging" /sys/class/power_supply/BAT*/status && systemctl suspend-then-hibernate || (pidof hyprlock >/dev/null && systemctl suspend)'
}
