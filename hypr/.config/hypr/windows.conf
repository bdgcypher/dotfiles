# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Hyprland 0.53+ syntax
windowrule = suppress_event maximize, match:class .*

# Tag all windows for default opacity (apps can override with -default-opacity tag)
windowrule = tag +default-opacity, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# App-specific tweaks (may remove default-opacity tag)
# source = ~/.local/share/omarchy/default/hypr/apps.conf

# Apply default opacity after apps have had a chance to opt out
windowrule = opacity 0.97 0.9, match:tag default-opacity



# Other App Specific Window Rules



# Bluetui (floating)
windowrule = float on, center on, size 800 600, match:initial_class floating.Bluetui

# Btop (floating)
windowrule = float on, center on, size 1000 800, match:initial_class floating.Btop

# Gazelle-tui (floating)
windowrule = float on, center on, size 800 800, match:initial_class floating.Gazelle

# Global Protect VPN (floating)
windowrule = float on, center on, size 400 100, match:initial_class floating.GlobalProtect

# Steam Games
windowrule = float on, center on, size 1920 1080, match:initial_class ^(steam_app_.*)$

# Wiremix (floating)
windowrule = float on, center on, size 800 600, match:initial_class floating.Wiremix

# Prevent Obsidian from stealing focus on reload
windowrule {
  name = Obsidian
  match:class = ^(obsidian)$
  focus_on_activate = false
}


# Package Management TUI's (floating)
windowrule = float on, center on, size 800 900, match:initial_class floating.Pacman
