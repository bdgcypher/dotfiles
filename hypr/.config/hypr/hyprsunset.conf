# Maximum gamma value (100-200)
max-gamma = 150

# Daytime: No filter
profile {
    time = 07:00
    identity = true
}

# Evening: Warmer, slightly dimmer
profile {
    time = 18:00
    temperature = 5500
    gamma = 0.9
}

# Night: Very warm, dimmer
profile {
    time = 22:00
    temperature = 3500
    gamma = 0.8
}

