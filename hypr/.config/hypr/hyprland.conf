# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# All hyprland configs
source = ~/.config/hypr/default-apps.conf
source = ~/.config/hypr/apps.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/bindings/applications.conf
source = ~/.config/hypr/bindings/clipboard.conf
source = ~/.config/hypr/bindings/media.conf
source = ~/.config/hypr/bindings/tiling.conf
source = ~/.config/hypr/bindings/utilities.conf
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Window rules
windowrule = match:class ^(Mouseless)$, no_blur on, center on
windowrule = float on, center on, size 800 800, match:initial_class org.omarchy.Gazelle

