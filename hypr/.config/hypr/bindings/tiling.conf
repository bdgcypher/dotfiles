# Control tiling

bindd = ALT, SLASH, $d Toggle split, layoutmsg, togglesplit # dwindle

bindd = ALT SHIFT, SLASH, $d Swap split, layoutmsg, swapsplit # dwindle

bindd = ALT, V, $d Spawn next window right, layoutmsg, preselect r # dwindle

bindd = ALT SHIFT, V, $d Spawn next window below, layoutmsg, preselect d # dwindle

bindd = ALT SUPER, P, Pseudo window, pseudo, # dwindle

bindd = ALT, T, Toggle window floating/tiling, togglefloating

bindd = ALT, T, Center floating window, centerwindow

bindd = ALT, F, Full screen, fullscreen, 0

bindd = ALT CTRL, F, Tiled full screen, fullscreenstate, 0 2

bindd = ALT SUPER, F, Full width, fullscreen, 1

bindd = ALT SUPER, O, Pop window out (float & pin), exec, omarchy-hyprland-window-pop

bindd = ALT SUPER, L, Toggle workspace layout between tiling and scrolling, exec, omarchy-hyprland-workspace-layout-toggle





# Hayami friendly  keybinds using arrow keys


# Move focus with ALT + up,down,left,right

bindd = ALT, left, Move window focus left, movefocus, l

bindd = ALT, right, Move window focus right, movefocus, r

bindd = ALT, up, Move window focus up, movefocus, u

bindd = ALT, down, Move window focus down, movefocus, d


# Swap active window with the one next to it with ALT + SHIFT + HNIO

bindd = ALT SHIFT, left, Swap window to the left, swapwindow, l

bindd = ALT SHIFT, right, Swap window to the right, swapwindow, r

bindd = ALT SHIFT, up, Swap window up, swapwindow, u

bindd = ALT SHIFT, down, Swap window down, swapwindow, d


# Resize active window with UKYP

binded = ALT CTRL, left, Shrink window left, resizeactive, -100 0

binded = ALT CTRL, up, Shrink window up, resizeactive, 0 -100

binded = ALT CTRL, down, Expand window down, resizeactive, 0 100

binded = ALT CTRL, right, Expand window right, resizeactive, 100 0


# Move floating window with HNIO (30px increments)

binde = ALT SHIFT, left, moveactive, -30 0

binde = ALT SHIFT, right, moveactive, 30 0

binde = ALT SHIFT, up, moveactive, 0 -30

binde = ALT SHIFT, down, moveactive, 0 30





# QWERTY specific keybindings


# Move focus with ALT + HJKL

bindd = ALT, h, Move window focus left, movefocus, l

bindd = ALT, l, Move window focus right, movefocus, r

bindd = ALT, k, Move window focus up, movefocus, u

bindd = ALT, j, Move window focus down, movefocus, d


# Swap active window with the one next to it with ALT + SHIFT + HJKL

bindd = ALT SHIFT, h, Swap window to the left, swapwindow, l

bindd = ALT SHIFT, l, Swap window to the right, swapwindow, r

bindd = ALT SHIFT, k, Swap window up, swapwindow, u

bindd = ALT SHIFT, j, Swap window down, swapwindow, d


# Resize active window with UIOP

binded = ALT, u, Shrink window left, resizeactive, -100 0

binded = ALT, i, Shrink window up, resizeactive, 0 -100

binded = ALT, o, Expand window down, resizeactive, 0 100

binded = ALT, p, Expand window right, resizeactive, 100 0


# Move floating window with HJKL (30px increments)

binde = ALT SHIFT, h, moveactive, -30 0

binde = ALT SHIFT, l, moveactive, 30 0

binde = ALT SHIFT, k, moveactive, 0 -30

binde = ALT SHIFT, j, moveactive, 0 30





# Switch workspaces with ALT + [1-9; 0]

bindd = ALT, code:10, Switch to workspace 1, workspace, 1

bindd = ALT, code:11, Switch to workspace 2, workspace, 2

bindd = Alt, code:12, Switch to workspace 3, workspace, 3

bindd = ALT, code:13, Switch to workspace 4, workspace, 4

bindd = ALT, code:14, Switch to workspace 5, workspace, 5

bindd = ALT, code:15, Switch to workspace 6, workspace, 6

bindd = ALT, code:16, Switch to workspace 7, workspace, 7

bindd = ALT, code:17, Switch to workspace 8, workspace, 8

bindd = ALT, code:18, Switch to workspace 9, workspace, 9

bindd = ALT, code:19, Switch to workspace 10, workspace, 10


# Move active window to a workspace with ALT + SHIFT + [1-9; 0]

bindd = ALT SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1

bindd = ALT SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2

bindd = ALT SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3

bindd = ALT SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4

bindd = ALT SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5

bindd = ALT SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6

bindd = ALT SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7

bindd = ALT SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8

bindd = ALT SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9

bindd = ALT SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10


# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]

bindd = ALT SHIFT SUPER, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1

bindd = ALT SHIFT SUPER, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2

bindd = ALT SHIFT SUPER, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3

bindd = ALT SHIFT SUPER, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4

bindd = ALT SHIFT SUPER, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5

bindd = ALT SHIFT SUPER, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6

bindd = ALT SHIFT SUPER, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7

bindd = ALT SHIFT SUPER, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8

bindd = ALT SHIFT SUPER, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9

bindd = ALT SHIFT SUPER, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10


# Minimize windows

bindd = ALT, M, Minimize window, movetoworkspacesilent, special:minimized

bindd = ALT SHIFT, M, View minimized windows, togglespecialworkspace, minimized

bind = ALT SHIFT, M, submap, minimized

submap = minimized

bind = , backspace, killactive

# QWERTY specific
bindd = , h, Move window focus left, movefocus, l

bindd = , l, Move window focus right, movefocus, r

bindd = , k, Move window focus up, movefocus, u

bindd = , j, Move window focus down, movefocus, d
# End QWERTY

# Hayami friendly (using up,down,left,right)
bindd = , left, Move window focus down, movefocus, d

bindd = , right, Move window focus right, movefocus, r

bindd = , down, Move window focus down, movefocus, d

bindd = , up, Move window focus up, movefocus, u
# End Hayami

bind = , Return, movetoworkspace, +0

bind = , Return, submap, reset

bind = , mouse:272, movetoworkspace, +0

bind = , mouse:272, submap, reset

bind = , escape, togglespecialworkspace, minimized

bind = , escape, submap, reset

submap = reset


# TAB between workspaces

bindd = SUPER, TAB, Next workspace, workspace, e+1

bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1

bindd = SUPER CTRL, TAB, Former workspace, workspace, previous


# Move workspaces to other monitors

bindd = ALT SHIFT SUPER, h, Move workspace to left monitor, movecurrentworkspacetomonitor, l

bindd = ALT SHIFT SUPER, l, Move workspace to right monitor, movecurrentworkspacetomonitor, r


# Cycle through applications on active workspace

bindd = ALT, TAB, Cycle to next window, cyclenext

bindd = ALT SHIFT, TAB, Cycle to prev window, cyclenext, prev

bindd = ALT, TAB, Reveal active window on top, bringactivetotop

bindd = ALT SHIFT, TAB, Reveal active window on top, bringactivetotop

# Scroll through existing workspaces with ALT + scroll

bindd = ALT, mouse_down, Scroll active workspace forward, workspace, e+1

bindd = ALT, mouse_up, Scroll active workspace backward, workspace, e-1


# Move/resize windows with mainMod + LMB/RMB and dragging

bindmd = ALT, mouse:272, Move window, movewindow

bindmd = ALT, mouse:273, Resize window, resizewindow


# Toggle groups

bindd = ALT, G, Toggle window grouping, togglegroup

bindd = ALT SUPER, G, Move active window out of group, moveoutofgroup


# Join groups

bindd = ALT SUPER, h, Move window to group on left, moveintogroup, l

bindd = ALT SUPER, l, Move window to group on right, moveintogroup, r

bindd = ALT SUPER, k, Move window to group on top, moveintogroup, u

bindd = ALT SUPER, j, Move window to group on bottom, moveintogroup, d


# Navigate a single set of grouped windows

bindd = ALT SUPER, TAB, Next window in group, changegroupactive, f

bindd = ALT SUPER SHIFT, TAB, Previous window in group, changegroupactive, b


# Window navigation for grouped windows

bindd = ALT CTRL, LEFT, Move grouped window focus left, changegroupactive, b

bindd = ALT CTRL, RIGHT, Move grouped window focus right, changegroupactive, f


# Scroll through a set of grouped windows with ALT + ALT + scroll

bindd = ALT SUPER, mouse_down, Next window in group, changegroupactive, f

bindd = ALT SUPER, mouse_up, Previous window in group, changegroupactive, b


# Activate window in a group by number

bindd = ALT SUPER, code:10, Switch to group window 1, changegroupactive, 1

bindd = ALT SUPER, code:11, Switch to group window 2, changegroupactive, 2

bindd = ALT SUPER, code:12, Switch to group window 3, changegroupactive, 3

bindd = ALT SUPER, code:13, Switch to group window 4, changegroupactive, 4

bindd = ALT SUPER, code:14, Switch to group window 5, changegroupactive, 5

