# Suspend-then-hibernate configuration.
#
# AllowSuspendThenHibernate + HibernateDelaySec: after HibernateDelaySec= in
# suspend, wake up and hibernate instead of sitting in s2idle indefinitely.
#
# HibernateOnACPower=no: while on AC power the countdown never starts and the
# system just stays suspended. The intent is "on battery suspend then hibernate,
# plugged in never hibernate" - a plain `systemctl suspend` while locked (AC) or
# a manual power-menu Suspend therefore stays in RAM until it is woken.
#
# systemd >= 257 is required for HibernateOnACPower=; older versions ignore the
# unknown key with a warning.
[Sleep]
AllowHibernation=yes
AllowSuspendThenHibernate=yes
HibernateDelaySec=15min
HibernateOnACPower=no
