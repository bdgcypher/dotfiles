# Lid switch behaviour.
#
# Battery: suspend-then-hibernate, so an unattended (or bagged) laptop writes a
# hibernation image instead of draining in s2idle. HibernateDelaySec= comes from
# systemd/sleep.conf.d/hibernate.conf.
# AC: plain suspend - HibernateOnACPower=no in that same drop-in keeps the
# machine suspended while plugged in instead of hibernating.
# Docked: do nothing here; Hyprland already disables the internal panel when an
# external monitor is attached (see hypr/.config/hypr/bindings/utilities.lua)
# and the external monitor should stay usable.
#
# Takes effect after a systemd-logind restart (or reboot).
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
