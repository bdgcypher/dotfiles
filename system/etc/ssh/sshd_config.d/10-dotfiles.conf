# sshd_config.d/10-dotfiles.conf — SSH server tuning for dotfiles machines.
# Drop-in config; merges with the package defaults in /etc/ssh/sshd_config.

# Allow both public-key and password logins so machines are reachable out of
# the box (password) while still supporting key auth once configured.
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication yes

# Avoid long hangs on reverse-DNS lookups when connecting.
UseDNS no