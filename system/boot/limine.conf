timeout: 0
quiet: yes
graphics: yes

default_entry: 1

/Arch Linux (linux)
    protocol: linux
    path: boot():/vmlinuz-linux
    cmdline: root=PARTUUID=@ROOT_PARTUUID@ zswap.enabled=0 rootflags=subvol=@ rw rootfstype=btrfs resume=PARTUUID=@ROOT_PARTUUID@ resume_offset=@RESUME_OFFSET@ quiet loglevel=1 rd.quiet rd.systemd.show_status=false rd.udev.log_level=3 rd.udev.log_priority=3 udev.log_priority=3 systemd.show_status=false systemd.log_level=err vt.global_cursor_default=0 vt.handoff=7 logo.nologo plymouth.ignore-serial-consoles audit=0 splash @GPU_CMDLINE@
    module_path: boot():/initramfs-linux.img
