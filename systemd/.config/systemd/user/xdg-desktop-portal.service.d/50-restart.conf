# The package unit for the portal front-end has no Restart= at all. Losing it
# looks like the backend being broken but is worse: every portal request fails,
# including the file chooser, because nothing is there to route it. D-Bus
# activation does not save this - a unit that died badly sits in the failed state
# and the next activation request is refused, so the portal stays gone until
# something restarts it by hand.
#
# on-failure rather than always: the front-end is a normal long-running D-Bus
# service that has no reason to exit by itself, so a clean exit is not the case
# worth chasing, and leaving that alone keeps D-Bus activation in charge of it.
[Service]
Restart=on-failure
RestartSec=1s
