# The package unit ships Restart=on-failure, which is one rung short of what a
# terminal file chooser needs. This backend is where every Save dialog ends up,
# so "not running" is not a quiet state - it is satty and every other GTK app
# reporting that you cancelled. A picker also goes away for reasons that are not
# failures: its terminal closes, or a suspend takes the process with it, and the
# exit status systemd sees is a clean one. So restart on any exit, not just a bad
# one. Explicit stops are unaffected - systemd never restarts a unit that someone
# asked to stop, which is what keeps PartOf=graphical-session.target working at
# logout.
[Service]
Restart=always
RestartSec=1s

# Default rate limiting stops trying after five starts in ten seconds, and a
# service in that state stays down - the precise "it died and never came back"
# this drop-in exists to prevent. An idle D-Bus backend restarted once a second
# costs less than the picker being gone, and a real crash loop is still visible
# in the journal as one restart per second.
[Unit]
StartLimitIntervalSec=0
