# cava, for the dictation glow's microphone reading.
#
# A configuration of its own rather than the desktop visualiser's: that one is
# pointed at the default *sink* by pywal's colours-cava.conf and is already
# running, so borrowing it would show the music the glow is not listening to.
# This instance reads the default source -- the microphone voxtype records from
# -- and exists only while voxtype is recording.
#
# The output is the machine format, not the bars: raw ascii, one frame per line,
# 32 values 0..100 separated by `;`. DictationState.qml folds that into the three
# bands the shader takes.
#
# `@DEFAULT_SOURCE@` is cava's own PulseAudio placeholder and is resolved by the
# server; it is deliberately not a device name, so a different microphone -- or
# a headset plugged in later -- is followed without editing this file.

[general]
bars = 32
framerate = 30
autosens = 1

[input]
method = pulse
source = @DEFAULT_SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
