name = "main"
name_pretty = "Menu"
icon = "󰍉"

# The app list opens at the same width as the main menu (250, which both
# launchers clamp up to ~304), so switching from one to the other does not
# resize the box.
[[entries]]
text = "Applications"
icon = "󰣆 "
actions = { "default" = "hayami-menu -m desktopapplications --width 250" }
weight = 100

[[entries]]
text = "Scripts"
icon = " "
actions = { "default" = "hayami-menu -m runner" }
weight = 90

[[entries]]
text = "System"
icon = " "
actions = { "default" = "hayami-menu -m menus:system --width 250" }
weight = 80

[[entries]]
text = "Utilities"
icon = " "
actions = { "default" = "hayami-menu -m menus:utilities --width 250" }
weight = 70

[[entries]]
text = "Web Search"
icon = "󰖟 "
actions = { "default" = "hayami-menu -m websearch" }
weight = 70

