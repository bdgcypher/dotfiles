name = "system/setup/bar/toggle"
name_pretty = "System → Setup → Bar → Toggle"
icon = "󰔡"

# One entry per module, then the three clusters they belong to, then the way
# back. A switch has no state to show in a static menu, so every entry reports
# what it did on the OSD instead -- see cypher-bar, which is what draws it.
# The clusters set their members, they are not a separate setting: hiding the
# status cluster and hiding its nine modules are the same thing.

